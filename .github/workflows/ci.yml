name: ci
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          if [ -f package.json ]; then
            if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ] || [ -f yarn.lock ]; then npm ci; else npm install; fi
          else
            echo "no package.json - skip (Dart/other project)"
          fi
      - name: Lint
        run: if [ -f package.json ]; then npm run lint --if-present; else echo "skip"; fi
      - name: Test
        run: if [ -f package.json ]; then npm test --if-present; else echo "skip"; fi
      - name: Secrets
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
