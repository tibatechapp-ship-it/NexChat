name: ci
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      # Fail closed: a missing package.json / test script is an ERROR, never a silent skip.
      - name: Verify the test surface exists
        run: |
          test -f package.json || { echo "package.json missing"; exit 1; }
          node -e "const s=require('./package.json').scripts||{}; if(!s.test){console.error('no test script');process.exit(1)}"

      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          # P6: اختبارات auth.js التشغيلية تستورد server/auth.js فعلياً — اعتماديات
          # الخادم (jsonwebtoken/bcryptjs/...) تُثبّت أيضاً وإلا فشل الاختبار في CI فقط
          # بMODULE_NOT_FOUND (محلياً server/node_modules موجود).
          if [ -f server/package-lock.json ]; then npm ci --prefix server --no-audit --no-fund; else npm install --prefix server --no-audit --no-fund; fi

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Full-history scan instead of push-range scans: gitleaks-action computes
      # <oldest-new-commit>^..<head>, which crashes ("unknown revision") when a
      # push introduces a root commit - git subtree add --squash creates exactly
      # such a parentless commit (see sila/). Docker keeps the tool pinned and
      # the scan exhaustive; exit 1 on any leak keeps the fail-closed contract.
      - name: Secrets
        run: |
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:latest \
            detect --source="/repo" --no-banner --redact --verbose

  # موديول صلة (sila/) وصل عبر git subtree وله package.json مستقل — بدون هذه
  # الوظيفة كان كوده يُدمج بلا أي اختبار في الـ CI الجذري.
  sila:
    name: sila (node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sila
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sila/package-lock.json

      - name: Verify the test surface exists
        run: |
          test -f package.json || { echo "sila/package.json missing"; exit 1; }
          node -e "const s=require('./package.json').scripts||{}; if(!s.test){console.error('no test script in sila');process.exit(1)}"

      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # تطبيقا Flutter: mobile (تطبيق رسن) و sila/flutter_app (موديول صلة).
  flutter:
    name: flutter (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [mobile, sila/flutter_app]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ملفات المنصات (android/ ios/) مرفوعة إلى Git ضمن PR #14 —
      # flutter create . لا يجوز تشغيلها هنا إطلاقاً: هي أداة تهيئة
      # تُستخدم مرة واحدة عند بدء المشروع، وتشغيلها في كل build يعيد
      # توليد widget_test.dart ويكسر التخصيصات اليدوية. نتحقق فقط من
      # وجود المجلدات (mobile فقط — sila/flutter_app وحدة صلة بلا
      # مجلدات منصات).
      - name: Verify platform folders exist
        if: matrix.app == 'mobile'
        run: |
          test -d android || (echo "android/ missing" && exit 1)
          test -d ios || (echo "ios/ missing" && exit 1)

      - name: Pub get
        run: flutter pub get

      # أخطاء الكود تُفشل الخطوة؛ الملاحظات الأسلوبية (info/warning) لا تُفشل.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test
