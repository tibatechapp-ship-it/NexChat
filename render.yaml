services:
  - type: web
    name: rasan-chat
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm install
    startCommand: node --experimental-sqlite server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: STATS_KEY
        generateValue: true
