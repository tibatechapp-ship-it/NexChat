services:
  - type: web
    name: rasan-server
    runtime: node
    rootDir: server
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /opt/render/project/src/data
    disk:
      name: rasan-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
